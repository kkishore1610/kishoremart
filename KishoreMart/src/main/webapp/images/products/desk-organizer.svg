<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480" role="img" aria-label="Desk Organizer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#edf7f0"/>
      <stop offset="100%" stop-color="#d5e8dc"/>
    </linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f4f7f4"/>
    </linearGradient>
  </defs>
  <rect width="640" height="480" rx="28" fill="url(#bg)"/>
  <circle cx="320" cy="190" r="128" fill="#ffffff" opacity=".55"/>
  <rect x="188" y="70" width="264" height="240" rx="30" fill="url(#tile)" stroke="#c7dbce" stroke-width="3"/>
  <text x="320" y="220" font-family="Segoe UI Emoji, Apple Color Emoji, sans-serif" font-size="112" text-anchor="middle">🗂️</text>
  <text x="320" y="370" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" fill="#173e2b" text-anchor="middle">Desk Organizer</text>
  <text x="320" y="410" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#53705d" text-anchor="middle">Stationery</text>
</svg>
